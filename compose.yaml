name: claimshield
services:
  nginx:
    image: nginx:1.28-alpine
    container_name: claimshield-nginx
    ports:
      - "${PUBLIC_PORT:-80}:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    mem_limit: 64m
    security_opt:
      - no-new-privileges:true
  frontend:
    build: ./frontend
    container_name: claimshield-frontend
    environment:
      INTERNAL_API_URL: http://backend:8000
    restart: unless-stopped
    mem_limit: 384m
    security_opt:
      - no-new-privileges:true
  backend:
    build: ./backend
    container_name: claimshield-backend
    env_file: .env
    environment:
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped
    mem_limit: 640m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 7s
      retries: 3
      start_period: 60s
volumes:
  uploads:
